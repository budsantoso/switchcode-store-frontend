name: Deploy Store Frontend to cPanel (Static FTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build Next.js & FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-store.switchcode.id/api

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /public_html/store.switchcode.id/
